<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Account confirmation | First Option Dating</title>
  <link rel="icon" href="/icon-192-v78.png">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#100e14;color:#f6f1e8;font:16px/1.6 system-ui,sans-serif}
    main{width:100%;max-width:480px;padding:32px;background:#1c1822;border:1px solid #58432c;border-radius:20px}img{display:block;width:210px;max-width:100%;margin:0 auto 24px}h1{font-size:26px;line-height:1.25}p{color:#ded7e3}label{display:block;margin-top:16px}input{width:100%;padding:12px;font:inherit;background:#100e14;color:#fff;border:1px solid #827586;border-radius:8px}button,.return{display:block;width:100%;margin-top:24px;padding:12px;border:0;border-radius:8px;background:#e7bd6b;color:#171017;font:600 16px system-ui;text-align:center;text-decoration:none;cursor:pointer}button:disabled{opacity:.6;cursor:wait}a{color:#e7bd6b}:focus-visible{outline:3px solid #e7bd6b;outline-offset:4px}[hidden]{display:none!important}.help{font-size:14px}
  </style>
</head>
<body>
  <main>
    <img src="/first-option-logo-v58.png" alt="First Option Dating">
    <h1 id="heading">Checking your link…</h1>
    <p id="status" role="status" aria-live="polite">Please wait while we check your account link.</p>
    <form id="reset-form" hidden>
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" required minlength="6" maxlength="4096">
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" required minlength="6" maxlength="4096">
      <p class="help">Use at least 6 characters. Your account may require a stronger password.</p>
      <button id="reset-button" type="submit">Save new password</button>
    </form>
    <a class="return" href="/">Return to First Option Dating</a>
    <p class="help">Need help? <a href="mailto:firstoptiondating@gmail.com">Contact us</a>.</p>
    <noscript><p>Enable JavaScript to complete this account action.</p></noscript>
  </main>
  <script type="module" src="/auth-action.js"></script>
</body>
</html>
