name: Beta Firebase tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/voice-video-beta]

permissions:
  contents: read

concurrency:
  group: beta-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firebase-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Firestore, Storage rules and calling tests
        run: npm exec --yes --package firebase-tools@13.35.1 -- firebase emulators:exec --only firestore,storage --config firebase.emulator.json --project demo-fod-call-tests 'npm run test:calls'

